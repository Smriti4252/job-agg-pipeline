name: Daily Job Aggregation Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ingest job data (Bronze)
        run: |
          python src/ingest_remoteok.py
          python src/ingest_remotive.py

      - name: Convert Bronze → Silver
        run: python src/bronze_to_silver.py

      - name: Convert Silver → Gold
        run: python src/silver_to_gold.py

      - name: Generate Digest
        run: python src/digest_generator.py

      - name: Send digest email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python src/email_sender.py
