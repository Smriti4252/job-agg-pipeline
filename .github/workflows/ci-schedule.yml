name: Daily Job Aggregation Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # FIX: Install pyarrow explicitly before other dependencies
    - name: Install pyarrow (for parquet support)
      run: pip install pyarrow==15.0.0 --upgrade

    # Install all project dependencies
    - name: Install dependencies
      run: pip install -r requirements.txt

    # Run all pipeline scripts
    - name: Run full pipeline (Bronze → Silver → Gold)
      run: |
        python src/ingest_remoteok.py
        python src/ingest_remotive.py
        python src/bronze_to_silver.py
        python src/silver_to_gold.py

    # Send email digest using GitHub Secrets
    - name: Send digest email
      env:
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        DIGEST_TO: ${{ secrets.DIGEST_TO }}
      run: python src/email_sender.py
